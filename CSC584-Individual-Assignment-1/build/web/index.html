<html>
    <head>
        <title>Personal Profile Form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
       <div class="container"> 
        <h1>Personal Profile</h1>
        <form action="ProfileServlet" method="post">
            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="field">
                <label for="studentId">Student ID</label>
                <input type="text" id="studetnId" name="studentId" required>
            </div>
            <div class="field">
                <label for="programme">Programme</label>
                <input type="text" id="programme" name="programme" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="field">
                <label for="hobbies">Hobbies</label>
                <input type="text" id="hobbies" name="hobbies" required>
            </div>
            <div class="field">
                <label for="intro">Short Self-Introduction</label>
                <textarea id="intro" name="intro" rows="1"></textarea>
            </div>
            <button type="submit">Submit Profile</button>
        </form>
       </div>
    </body>
</html>
